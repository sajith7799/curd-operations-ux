<mat-card>
    <mat-card-header>
        <!-- <h2>Employee listing</h2> -->
        <button mat-raised-button color="primary" (click)="addemployee()">Add New</button>
        
    </mat-card-header>
    <mat-card-content>
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

            <!--- Note that these columns can be defined in any order.
                  The actual rendered columns are set as a property on the row definition" -->
          
            <!-- Position Column -->
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef> id </th>
              <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>
          
            <!-- Name Column -->
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef> Name </th>
              <td mat-cell *matCellDef="let element"> {{element.name}} </td>
            </ng-container>
          
            <!-- Weight Column -->
            <ng-container matColumnDef="doj">
              <th mat-header-cell *matHeaderCellDef> date of joining </th>
              <td mat-cell *matCellDef="let element"> {{element.doj | date}}</td>
            </ng-container>
            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef> role </th>
                <td mat-cell *matCellDef="let element"> {{element.role}}</td>
              </ng-container>
            <!-- Symbol Column -->
            <ng-container matColumnDef="salary">
              <th mat-header-cell *matHeaderCellDef> salary</th>
              <td mat-cell *matCellDef="let element"> {{element.salary | currency}}</td>
            </ng-container>
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> actions</th>
                <td mat-cell *matCellDef="let element">
                    <button mat-raised-button color="primary"(click)="editemployee(element.id)">Edit</button>
                    <button mat-raised-button color="accent"(click)="deleteemployee(element.id)">delete</button>
                </td>
              </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
    </mat-card-content>
</mat-card>
