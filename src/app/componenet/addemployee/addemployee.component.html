
<form [formGroup]="empForm"(ngSubmit)="Saveemployee()"><mat-card>
    <mat-card-header>
        <!-- <h2>Employee listing</h2> -->
       <h2>{{title}}</h2>
        
    </mat-card-header>
    <mat-card-content>
  

    <mat-form-field>
        <mat-label >Employee Id</mat-label>
        <input matInput formControlName="id">

    </mat-form-field>
    <mat-form-field>
        <mat-label>Employee name</mat-label>
        <input matInput formControlName="name">
    </mat-form-field>
    <mat-form-field>
        <mat-label>Employee DOJ</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="doj">
       
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
    <mat-form-field>
        <mat-label>Employee Role </mat-label>
        <mat-select  formControlName="role">
            <mat-option value="">please select the role</mat-option>
            <mat-option value="manger">Manger</mat-option>
            <mat-option value="Lead">lead</mat-option>
            <mat-option value="operator">operator</mat-option>
        </mat-select>
      
    </mat-form-field>
    <mat-form-field>
        <mat-label>Employee salary </mat-label>
        <input matInput formControlName="salary">
    </mat-form-field>
 
    </mat-card-content>
    <mat-card-actions>
        <button type="submit" mat-raised-button color="primary">save</button>
        <a mat-raised-button color="accent" (click)="closepopup()">close</a>
    </mat-card-actions>
</mat-card>
</form>
